<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>KICKR Headwind – iPhone Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #020617 75%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    /* Giant touch-friendly custom range slider */
    .slider-track {
      touch-action: none;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 44px;
      width: 44px;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 4px 20px rgba(34, 211, 238, 0.85), 0 0 0 3px #06b6d4;
      cursor: pointer;
    }
    @keyframes spinFan {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .fan-spin {
      animation: spinFan var(--spin-duration, 2s) linear infinite;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(51, 65, 85, 0.65);
    }
    .btn-press {
      transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn-press:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body class="flex flex-col justify-between px-3.5 pt-2.5 pb-3 max-w-md mx-auto select-none">

  <!-- 1. COMPACT TOP STATUS & CONNECT BAR -->
  <header class="glass-card rounded-2xl px-3.5 py-2.5 flex items-center justify-between gap-2 shadow-lg shrink-0">
    <div class="flex items-center gap-2.5 min-w-0">
      <div id="fanBadge" class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-md shadow-cyan-500/25 shrink-0">
        <svg id="fanIcon" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 12c0-3 2.5-5.5 5.5-5.5S23 9 23 12H12z"/>
          <path d="M12 12c3 0 5.5 2.5 5.5 5.5S15 23 12 23V12z"/>
          <path d="M12 12c0 3-2.5 5.5-5.5 5.5S1 15 1 12h11z"/>
          <path d="M12 12c-3 0-5.5-2.5-5.5-5.5S9 1 12 1v11z"/>
          <circle cx="12" cy="12" r="2"/>
        </svg>
      </div>
      <div class="min-w-0">
        <div class="flex items-center gap-1.5">
          <span id="connDot" class="w-2 h-2 rounded-full bg-slate-500 shrink-0"></span>
          <h1 id="connStatusText" class="text-xs font-extrabold text-white truncate">Nicht gekoppelt</h1>
        </div>
        <div id="autoReconnectBadge" class="text-[10px] font-semibold text-emerald-400 truncate mt-0.5">
          🛡️ Auto-Reconnect &amp; Echtzeit-Timer aktiv
        </div>
      </div>
    </div>

    <div class="flex items-center gap-1.5 shrink-0">
      <button id="btnConnect" onclick="connectHeadwind(false)" class="btn-press px-4 py-2.5 rounded-xl text-xs font-black tracking-wide bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 shadow-md shadow-cyan-500/20">
        Koppeln
      </button>
      <button onclick="openSetupModal()" aria-label="Einstellungen" class="btn-press p-2.5 rounded-xl bg-slate-800/90 text-slate-300 border border-slate-700/80">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- 2. HERO SPEED GAUGE + GIANT SLIDER + 4 BIG FINE BUTTONS -->
  <section class="glass-card rounded-3xl p-4 shadow-xl flex flex-col justify-between space-y-3 shrink-0">
    <div class="flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Fahrtwind</span>
          <span id="windKmh" class="px-2 py-0.5 rounded-full bg-cyan-500/15 border border-cyan-500/30 text-[11px] font-extrabold text-cyan-300">0 km/h</span>
        </div>
        <div class="flex items-baseline gap-1 mt-0.5">
          <span id="speedValue" class="text-6xl font-black tracking-tighter text-white tabular-nums leading-none">0</span>
          <span class="text-3xl font-black text-cyan-400">%</span>
        </div>
        <div id="subModeStatus" class="text-[11px] text-emerald-400 font-bold mt-1 hidden"></div>
      </div>

      <!-- Giant Unmissable STOP 0% Button -->
      <button onclick="setManualSpeed(0, true)" class="btn-press w-24 h-20 rounded-2xl bg-rose-500/20 border-2 border-rose-500/50 text-rose-300 flex flex-col items-center justify-center shadow-lg shadow-rose-950/50">
        <svg class="w-6 h-6 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
        <span class="text-xs font-black tracking-wide">STOP 0%</span>
      </button>
    </div>

    <!-- Active Automation Countdown Banner (shown only when timer runs) -->
    <div id="timerBanner" class="hidden items-center justify-between px-3.5 py-2 rounded-2xl bg-cyan-500/20 border border-cyan-400/50 text-xs">
      <span id="timerLabel" class="font-extrabold text-cyan-200 truncate pr-2">Warmup aktiv</span>
      <div class="flex items-center gap-2 shrink-0">
        <span id="timerClock" class="font-mono font-black text-sm text-white bg-slate-950 px-2.5 py-1 rounded-xl border border-cyan-500/40">08:00</span>
        <button onclick="stopAutomation()" class="btn-press px-2.5 py-1 rounded-xl bg-rose-500/30 border border-rose-400/40 text-rose-100 font-extrabold">Aus</button>
      </div>
    </div>

    <!-- Thick Sweat-Proof Touch Slider -->
    <div class="slider-track relative h-14 bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden flex items-center px-2">
      <div id="sliderFill" class="absolute inset-y-0 left-0 bg-gradient-to-r from-cyan-600/60 via-cyan-500/70 to-blue-500/80 pointer-events-none transition-all duration-75" style="width: 0%;"></div>
      <input id="speedSlider" type="range" min="0" max="100" step="1" value="0" oninput="setManualSpeed(Number(this.value), true)" aria-label="Lüfterstärke" class="relative z-10" />
    </div>

    <!-- 4 Extra-Wide Fine Tuning Buttons (-5%, -1%, +1%, +5%) -->
    <div class="grid grid-cols-4 gap-2">
      <button onclick="adjustSpeed(-5)" class="btn-press py-3.5 rounded-2xl font-black text-base bg-slate-800/95 text-slate-100 border border-slate-700 shadow-sm">-5 %</button>
      <button onclick="adjustSpeed(-1)" class="btn-press py-3.5 rounded-2xl font-black text-base bg-slate-800/95 text-slate-200 border border-slate-700 shadow-sm">-1 %</button>
      <button onclick="adjustSpeed(1)" class="btn-press py-3.5 rounded-2xl font-black text-base bg-cyan-500/15 text-cyan-300 border border-cyan-500/35 shadow-sm">+1 %</button>
      <button onclick="adjustSpeed(5)" class="btn-press py-3.5 rounded-2xl font-black text-base bg-cyan-500/20 text-cyan-200 border border-cyan-500/45 shadow-sm">+5 %</button>
    </div>
  </section>

  <!-- 3. 6 LARGE DIRECT-SELECT PRESET TILES (2x3 Grid) -->
  <section class="glass-card rounded-3xl p-3.5 shadow-xl shrink-0">
    <div id="presetsGrid" class="grid grid-cols-3 gap-2"></div>
  </section>

  <!-- 4. 4 ONE-TAP SMART AUTOMATION BUTTONS (2x2 Grid, No Tiny Dropdowns!) -->
  <section class="grid grid-cols-2 gap-2.5 shrink-0">
    <!-- 1-Tap Warmup -->
    <button id="btnWarmupTile" onclick="toggleWarmup()" class="btn-press glass-card rounded-2xl p-3 text-left flex items-center justify-between border border-amber-500/30">
      <div>
        <div class="text-xs font-black text-amber-300 flex items-center gap-1">🔥 Warmup</div>
        <div id="warmupSubtext" class="text-[11px] font-semibold text-slate-400 mt-0.5">8 Min: 15% &rarr; 50%</div>
      </div>
      <span class="text-xs font-black px-2 py-1 rounded-lg bg-amber-500/20 text-amber-300">Start</span>
    </button>

    <!-- 1-Tap Interval Boost -->
    <button id="btnBoostTile" onclick="toggleBoost()" class="btn-press glass-card rounded-2xl p-3 text-left flex items-center justify-between border border-cyan-500/30">
      <div>
        <div class="text-xs font-black text-cyan-300 flex items-center gap-1">⚡ Intervall-Boost</div>
        <div id="boostSubtext" class="text-[11px] font-semibold text-slate-400 mt-0.5">3 Min Vollgas (95%)</div>
      </div>
      <span class="text-xs font-black px-2 py-1 rounded-lg bg-cyan-500/20 text-cyan-300">Boost</span>
    </button>

    <!-- 1-Tap Cooldown -->
    <button id="btnCooldownTile" onclick="toggleCooldown()" class="btn-press glass-card rounded-2xl p-3 text-left flex items-center justify-between border border-indigo-500/30">
      <div>
        <div class="text-xs font-black text-indigo-300 flex items-center gap-1">❄️ Cooldown</div>
        <div id="cooldownSubtext" class="text-[11px] font-semibold text-slate-400 mt-0.5">5 Min &rarr; Auto-Aus</div>
      </div>
      <span class="text-xs font-black px-2 py-1 rounded-lg bg-indigo-500/20 text-indigo-300">Start</span>
    </button>

    <!-- 1-Tap Natural Road-Wind Wave Mode -->
    <button id="btnWaveTile" onclick="toggleWaveMode()" class="btn-press glass-card rounded-2xl p-3 text-left flex items-center justify-between border border-emerald-500/30">
      <div>
        <div class="text-xs font-black text-emerald-300 flex items-center gap-1">🌊 Fahrtwind</div>
        <div id="waveSubtext" class="text-[11px] font-semibold text-slate-400 mt-0.5">Böen ±10 % (12s)</div>
      </div>
      <span id="waveBadge" class="text-xs font-black px-2 py-1 rounded-lg bg-slate-800 text-slate-300">Aus</span>
    </button>
  </section>

  <!-- SETUP / CUSTOMIZATION MODAL (Hidden during ride, opened via Gear icon) -->
  <div id="setupModal" class="fixed inset-0 z-50 hidden bg-slate-950/90 backdrop-blur-md p-4 overflow-y-auto">
    <div class="max-w-md mx-auto bg-slate-900 border border-slate-700 rounded-3xl p-5 space-y-5 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <h2 class="text-base font-black text-white">Headwind Einstellungen</h2>
          <p class="text-xs text-slate-400">Direktwahl-Stufen &amp; Timer-Dauer anpassen</p>
        </div>
        <button onclick="closeSetupModal()" class="btn-press px-3.5 py-1.5 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs">
          ✓ Fertig
        </button>
      </div>

      <!-- Edit 6 Presets -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-extrabold uppercase text-slate-300">6 Direktwahl-Kacheln</span>
          <button onclick="resetPresets()" class="text-xs font-bold text-cyan-400">Standardwerte</button>
        </div>
        <div id="setupPresetsGrid" class="grid grid-cols-2 gap-2.5"></div>
      </div>

      <!-- Edit Timer Defaults -->
      <div class="space-y-3 border-t border-slate-800 pt-3">
        <span class="text-xs font-extrabold uppercase text-slate-300 block">Automatik-Konfiguration</span>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">🔥 Warmup-Dauer</label>
            <select id="warmupMin" onchange="saveTimerPrefs()" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs font-bold text-white">
              <option value="5">5 Minuten</option>
              <option value="8" selected>8 Minuten</option>
              <option value="10">10 Minuten</option>
              <option value="12">12 Minuten</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">🔥 Warmup-Ziel</label>
            <select id="warmupTarget" onchange="saveTimerPrefs()" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs font-bold text-cyan-300">
              <option value="40">40 %</option>
              <option value="50" selected>50 %</option>
              <option value="65">65 %</option>
              <option value="75">75 %</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">⚡ Boost-Dauer</label>
            <select id="boostMin" onchange="saveTimerPrefs()" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs font-bold text-white">
              <option value="2">2 Minuten</option>
              <option value="3" selected>3 Minuten</option>
              <option value="5">5 Minuten</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">❄️ Cooldown-Dauer</label>
            <select id="cooldownMin" onchange="saveTimerPrefs()" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs font-bold text-white">
              <option value="3">3 Minuten</option>
              <option value="5" selected>5 Minuten</option>
              <option value="8">8 Minuten</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Unfiltered BLE Scan Fallback -->
      <div class="border-t border-slate-800 pt-3 flex items-center justify-between">
        <span class="text-xs text-slate-400">Gerät wird nicht gefunden?</span>
        <button onclick="closeSetupModal(); connectHeadwind(true);" class="px-3 py-2 rounded-xl bg-slate-800 text-cyan-300 border border-cyan-500/30 text-xs font-bold">
          🔍 Alle BLE-Geräte scannen
        </button>
      </div>
    </div>
  </div>

  <script>
    const SERVICE_UUID = 'a026ee0c-0a7d-4ab3-97fa-f1500f9feb8b';
    const CHAR_UUID = 'a026e038-0a7d-4ab3-97fa-f1500f9feb8b';
    const STORAGE_KEY = 'strava_pulse_headwind_presets_v1';
    const TIMERS_KEY = 'strava_pulse_headwind_timers_v1';

    let baseSpeed = 0;
    let effectiveSpeed = 0;
    let isConnected = false;
    let waveMode = false;
    let waveTimer = null;
    let waveStart = 0;

    let bleDevice = null;
    let controlChar = null;
    let manualInitialized = false;
    let isWriting = false;
    let pendingSpeed = null;

    let activeTimer = null;
    let automationState = null;

    const defaultPresets = [
      { id: 'p0', label: 'Aus', percent: 0 },
      { id: 'p1', label: 'Warmup', percent: 20 },
      { id: 'p2', label: 'GA1 Basis', percent: 40 },
      { id: 'p3', label: 'Tempo', percent: 60 },
      { id: 'p4', label: 'Schwelle', percent: 80 },
      { id: 'p5', label: 'Vollgas', percent: 100 }
    ];

    let presets = (() => {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(saved) && saved.length === 6) return saved;
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultPresets));
    })();

    function loadTimerPrefs() {
      try {
        const saved = JSON.parse(localStorage.getItem(TIMERS_KEY));
        if (saved) {
          if (saved.warmupMin) document.getElementById('warmupMin').value = saved.warmupMin;
          if (saved.warmupTarget) document.getElementById('warmupTarget').value = saved.warmupTarget;
          if (saved.boostMin) document.getElementById('boostMin').value = saved.boostMin;
          if (saved.cooldownMin) document.getElementById('cooldownMin').value = saved.cooldownMin;
        }
      } catch (e) {}
      updateTileSubtexts();
    }

    function saveTimerPrefs() {
      const prefs = {
        warmupMin: document.getElementById('warmupMin').value,
        warmupTarget: document.getElementById('warmupTarget').value,
        boostMin: document.getElementById('boostMin').value,
        cooldownMin: document.getElementById('cooldownMin').value
      };
      try { localStorage.setItem(TIMERS_KEY, JSON.stringify(prefs)); } catch (e) {}
      updateTileSubtexts();
    }

    function updateTileSubtexts() {
      const wMin = document.getElementById('warmupMin').value || 8;
      const wTarg = document.getElementById('warmupTarget').value || 50;
      const bMin = document.getElementById('boostMin').value || 3;
      const cMin = document.getElementById('cooldownMin').value || 5;
      document.getElementById('warmupSubtext').innerHTML = `${wMin} Min: 15% &rarr; ${wTarg}%`;
      document.getElementById('boostSubtext').textContent = `${bMin} Min Vollgas (95%)`;
      document.getElementById('cooldownSubtext').innerHTML = `${cMin} Min &rarr; Auto-Aus`;
    }

    function renderPresets() {
      const grid = document.getElementById('presetsGrid');
      grid.innerHTML = '';
      presets.forEach((p) => {
        const active = baseSpeed === p.percent;
        const btn = document.createElement('button');
        btn.className = `btn-press py-3 px-3 rounded-2xl border text-left flex flex-col justify-between ${
          active
            ? 'bg-gradient-to-br from-cyan-500/30 to-blue-600/30 border-cyan-400 text-white shadow-md shadow-cyan-500/15'
            : 'bg-slate-900/90 border-slate-800 text-slate-200'
        }`;
        btn.onclick = () => setManualSpeed(p.percent, true);
        btn.innerHTML = `
          <div class="text-2xl font-black tabular-nums leading-none ${active ? 'text-cyan-300' : 'text-white'}">${p.percent}<span class="text-xs font-bold ml-0.5">%</span></div>
          <div class="text-[11px] font-bold text-slate-300 truncate mt-1">${p.label}</div>
        `;
        grid.appendChild(btn);
      });
    }

    function openSetupModal() {
      const setupGrid = document.getElementById('setupPresetsGrid');
      setupGrid.innerHTML = '';
      presets.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'p-2.5 rounded-2xl bg-slate-950 border border-slate-800 space-y-1.5';
        card.innerHTML = `
          <input type="text" value="${p.label}" onchange="presets[${idx}].label = this.value" class="w-full px-2 py-1 rounded-lg bg-slate-900 border border-slate-700 text-xs font-bold text-white" />
          <div class="flex items-center gap-1">
            <input type="number" min="0" max="100" value="${p.percent}" onchange="presets[${idx}].percent = Math.max(0, Math.min(100, Math.round(Number(this.value)||0)))" class="w-full px-2 py-1 rounded-lg bg-slate-900 border border-slate-700 text-sm font-black text-cyan-300" />
            <span class="text-xs font-bold text-slate-400">%</span>
          </div>
        `;
        setupGrid.appendChild(card);
      });
      document.getElementById('setupModal').classList.remove('hidden');
    }

    function closeSetupModal() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(presets)); } catch (e) {}
      saveTimerPrefs();
      document.getElementById('setupModal').classList.add('hidden');
      renderPresets();
    }

    function resetPresets() {
      presets = JSON.parse(JSON.stringify(defaultPresets));
      openSetupModal();
    }

    function updateUI() {
      document.getElementById('speedValue').textContent = effectiveSpeed;
      document.getElementById('windKmh').textContent = `≈ ${Math.round((effectiveSpeed / 100) * 48)} km/h`;
      document.getElementById('speedSlider').value = baseSpeed;
      document.getElementById('sliderFill').style.width = `${baseSpeed}%`;

      const fan = document.getElementById('fanIcon');
      if (effectiveSpeed > 0) {
        const dur = Math.max(0.25, 2.2 - (effectiveSpeed / 100) * 1.9);
        fan.style.setProperty('--spin-duration', `${dur}s`);
        fan.classList.add('fan-spin');
      } else {
        fan.classList.remove('fan-spin');
      }

      const sub = document.getElementById('subModeStatus');
      if (waveMode && baseSpeed > 0) {
        sub.textContent = `🌊 Böen-Basis: ${baseSpeed}% (±10%)`;
        sub.classList.remove('hidden');
      } else {
        sub.classList.add('hidden');
      }
      renderPresets();
    }

    async function flushBleQueue() {
      if (isWriting || !controlChar || pendingSpeed === null) return;
      isWriting = true;
      try {
        while (pendingSpeed !== null) {
          const target = pendingSpeed;
          pendingSpeed = null;
          if (target === 0) {
            const cmd = new Uint8Array([0x02, 0x00]);
            await (controlChar.writeValueWithResponse ? controlChar.writeValueWithResponse(cmd) : controlChar.writeValue(cmd));
          } else {
            if (!manualInitialized) {
              const modeCmd = new Uint8Array([0x04, 0x04]);
              await (controlChar.writeValueWithResponse ? controlChar.writeValueWithResponse(modeCmd) : controlChar.writeValue(modeCmd));
              manualInitialized = true;
            }
            const speedCmd = new Uint8Array([0x02, target]);
            await (controlChar.writeValueWithResponse ? controlChar.writeValueWithResponse(speedCmd) : controlChar.writeValue(speedCmd));
          }
        }
      } catch (e) {
        console.warn('BLE write warn:', e);
      } finally {
        isWriting = false;
      }
    }

    function pushSpeedToHardware(val) {
      effectiveSpeed = Math.max(0, Math.min(100, Math.round(val)));
      if (isConnected && controlChar) {
        pendingSpeed = effectiveSpeed;
        flushBleQueue();
      }
      updateUI();
    }

    function setManualSpeed(val, cancelAuto) {
      baseSpeed = Math.max(0, Math.min(100, Math.round(val)));
      if (cancelAuto && automationState) {
        stopAutomation();
      }
      if (!waveMode || baseSpeed === 0) {
        pushSpeedToHardware(baseSpeed);
      } else {
        updateUI();
      }
    }

    function adjustSpeed(delta) {
      setManualSpeed(baseSpeed + delta, false);
    }

    function setConnectionStatusUI(connected, label) {
      const dot = document.getElementById('connDot');
      const txt = document.getElementById('connStatusText');
      const btn = document.getElementById('btnConnect');
      txt.textContent = label;
      if (connected) {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0';
        btn.textContent = 'Trennen';
        btn.className = 'btn-press px-3.5 py-2.5 rounded-xl text-xs font-extrabold bg-rose-500/20 text-rose-300 border border-rose-500/40';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-slate-500 shrink-0';
        btn.textContent = 'Koppeln';
        btn.className = 'btn-press px-4 py-2.5 rounded-xl text-xs font-black tracking-wide bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 shadow-md shadow-cyan-500/20';
      }
    }

    async function connectHeadwind(scanAll = false) {
      if (isConnected && bleDevice?.gatt?.connected) {
        bleDevice.gatt.disconnect();
        return;
      }
      if (!navigator.bluetooth) {
        setConnectionStatusUI(false, 'Bitte in Bluefy öffnen (BLE)');
        return;
      }
      try {
        document.getElementById('connStatusText').textContent = 'Suche KICKR...';
        const optionalUuids = [
          SERVICE_UUID,
          'a026ee0b-0a7d-4ab3-97fa-f1500f9feb8b',
          '00001818-0000-1000-8000-00805f9b34fb',
          '00001826-0000-1000-8000-00805f9b34fb',
          '0000180a-0000-1000-8000-00805f9b34fb',
          '0000180f-0000-1000-8000-00805f9b34fb'
        ];

        if (scanAll) {
          bleDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: optionalUuids
          });
        } else {
          bleDevice = await navigator.bluetooth.requestDevice({
            filters: [
              { namePrefix: 'KICKR' },
              { namePrefix: 'HEADWIND' },
              { namePrefix: 'Wahoo' },
              { namePrefix: 'WAHOO' },
              { namePrefix: 'ELEMNT' }
            ],
            optionalServices: optionalUuids
          });
        }

        bleDevice.addEventListener('gattserverdisconnected', () => {
          isConnected = false;
          controlChar = null;
          manualInitialized = false;
          setConnectionStatusUI(false, 'Verbindung getrennt');
        });

        document.getElementById('connStatusText').textContent = `Verbinde...`;
        const server = await bleDevice.gatt.connect();

        try {
          const service = await server.getPrimaryService(SERVICE_UUID);
          controlChar = await service.getCharacteristic(CHAR_UUID);
          try { await controlChar.startNotifications(); } catch (e) {}

          const modeCmd = new Uint8Array([0x04, 0x04]);
          await (controlChar.writeValueWithResponse ? controlChar.writeValueWithResponse(modeCmd) : controlChar.writeValue(modeCmd));
          manualInitialized = true;
          isConnected = true;

          setConnectionStatusUI(true, bleDevice.name || 'KICKR Headwind');
          pushSpeedToHardware(baseSpeed);
        } catch (serviceErr) {
          isConnected = true;
          controlChar = null;
          setConnectionStatusUI(true, `${bleDevice.name || 'KICKR'} (Test-Modus)`);
          updateUI();
        }
      } catch (e) {
        setConnectionStatusUI(false, 'Nicht gekoppelt');
      }
    }

    function toggleWaveMode() {
      waveMode = !waveMode;
      const badge = document.getElementById('waveBadge');
      const tile = document.getElementById('btnWaveTile');
      if (waveTimer) clearInterval(waveTimer);
      if (waveMode) {
        badge.textContent = 'AKTIV';
        badge.className = 'text-xs font-black px-2 py-1 rounded-lg bg-emerald-500 text-slate-950';
        tile.className = 'btn-press glass-card rounded-2xl p-3 text-left flex items-center justify-between border-2 border-emerald-400';
        waveStart = Date.now();
        waveTimer = setInterval(() => {
          if (baseSpeed === 0) {
            pushSpeedToHardware(0);
            return;
          }
          const elapsed = (Date.now() - waveStart) / 1000;
          const offset = Math.round(Math.sin((2 * Math.PI * elapsed) / 12) * 10);
          pushSpeedToHardware(Math.max(5, Math.min(100, baseSpeed + offset)));
        }, 1500);
      } else {
        badge.textContent = 'Aus';
        badge.className = 'text-xs font-black px-2 py-1 rounded-lg bg-slate-800 text-slate-300';
        tile.className = 'btn-press glass-card rounded-2xl p-3 text-left flex items-center justify-between border border-emerald-500/30';
        pushSpeedToHardware(baseSpeed);
      }
      updateUI();
    }

    function formatClock(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function stopAutomation() {
      if (activeTimer) clearInterval(activeTimer);
      activeTimer = null;
      automationState = null;
      document.getElementById('timerBanner').classList.add('hidden');
      document.getElementById('timerBanner').classList.remove('flex');
    }

    function runAutomationLoop() {
      if (activeTimer) clearInterval(activeTimer);
      const banner = document.getElementById('timerBanner');
      banner.classList.remove('hidden');
      banner.classList.add('flex');

      activeTimer = setInterval(() => {
        if (!automationState) return;
        automationState.remaining = Math.max(0, Math.round((automationState.endTime - Date.now()) / 1000));
        document.getElementById('timerClock').textContent = formatClock(automationState.remaining);

        if (automationState.remaining <= 0) {
          const finalSpeed = automationState.finalSpeed;
          stopAutomation();
          setManualSpeed(finalSpeed, false);
          return;
        }

        if (automationState.type === 'warmup') {
          const ramp = Math.min(90, Math.floor(automationState.total * 0.35));
          if (automationState.remaining <= ramp && ramp > 0) {
            const prog = 1 - automationState.remaining / ramp;
            const cur = Math.round(automationState.start + (automationState.finalSpeed - automationState.start) * prog);
            setManualSpeed(cur, false);
          }
        } else if (automationState.type === 'cooldown') {
          const half = Math.floor(automationState.total / 2);
          setManualSpeed(automationState.remaining > half ? automationState.high : 30, false);
        }
      }, 1000);
    }

    function toggleWarmup() {
      if (automationState?.type === 'warmup') {
        stopAutomation();
        return;
      }
      const mins = Number(document.getElementById('warmupMin').value) || 8;
      const target = Number(document.getElementById('warmupTarget').value) || 50;
      const total = mins * 60;
      automationState = { type: 'warmup', start: 15, finalSpeed: target, total, remaining: total, endTime: Date.now() + total * 1000 };
      document.getElementById('timerLabel').textContent = `🔥 Warmup (15% → ${target}%)`;
      document.getElementById('timerClock').textContent = formatClock(total);
      setManualSpeed(15, false);
      runAutomationLoop();
    }

    function toggleBoost() {
      if (automationState?.type === 'boost') {
        stopAutomation();
        return;
      }
      const mins = Number(document.getElementById('boostMin').value) || 3;
      const boostVal = 95;
      const ret = baseSpeed > 0 ? baseSpeed : 45;
      const total = mins * 60;
      automationState = { type: 'boost', finalSpeed: ret, total, remaining: total, endTime: Date.now() + total * 1000 };
      document.getElementById('timerLabel').textContent = `⚡ Boost 95% (danach ${ret}%)`;
      document.getElementById('timerClock').textContent = formatClock(total);
      setManualSpeed(boostVal, false);
      runAutomationLoop();
    }

    function toggleCooldown() {
      if (automationState?.type === 'cooldown') {
        stopAutomation();
        return;
      }
      const mins = Number(document.getElementById('cooldownMin').value) || 5;
      const high = Math.max(baseSpeed, 65);
      const total = mins * 60;
      automationState = { type: 'cooldown', high, finalSpeed: 0, total, remaining: total, endTime: Date.now() + total * 1000 };
      document.getElementById('timerLabel').textContent = `❄️ Cooldown (${high}% → 30% → 0%)`;
      document.getElementById('timerClock').textContent = formatClock(total);
      setManualSpeed(high, false);
      runAutomationLoop();
    }

    // Auto-reconnect GATT & WakeLock when switching back from Unified Remote to Bluefy
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        const badge = document.getElementById('autoReconnectBadge');
        if (badge) {
          badge.innerHTML = '🔄 Zurück aus Hintergrund • Sync aktiv';
          badge.className = 'text-[10px] font-bold text-cyan-300 truncate mt-0.5';
          setTimeout(() => {
            badge.innerHTML = '🛡️ Auto-Reconnect &amp; Echtzeit-Timer aktiv';
            badge.className = 'text-[10px] font-semibold text-emerald-400 truncate mt-0.5';
          }, 3500);
        }
        if ('wakeLock' in navigator && !window._wakeLock) {
          try { window._wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }
        if (bleDevice && !bleDevice.gatt.connected) {
          try {
            setConnectionStatusUI(false, 'Verbinde automatisch neu...');
            const server = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            controlChar = await service.getCharacteristic(CHAR_UUID);
            try { await controlChar.startNotifications(); } catch (e) {}
            const modeCmd = new Uint8Array([0x04, 0x04]);
            await (controlChar.writeValueWithResponse ? controlChar.writeValueWithResponse(modeCmd) : controlChar.writeValue(modeCmd));
            manualInitialized = true;
            isConnected = true;
            setConnectionStatusUI(true, bleDevice.name || 'KICKR Headwind');
            pushSpeedToHardware(baseSpeed);
          } catch (e) {
            if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
              isConnected = true;
              setConnectionStatusUI(true, `${bleDevice.name || 'KICKR'} (Wiederverbunden)`);
            }
          }
        }
      }
    });

    document.addEventListener('click', async () => {
      if ('wakeLock' in navigator && !window._wakeLock) {
        try { window._wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      }
    }, { once: true });

    loadTimerPrefs();
    updateUI();
  </script>
</body>
</html>
